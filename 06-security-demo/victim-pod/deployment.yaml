apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: victim
  labels:
    app: payment-service
    demo: hostpid-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
