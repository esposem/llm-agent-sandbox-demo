apiVersion: v1
kind: ServiceAccount
metadata:
  name: hostpid-demo-sa
  namespace: llm-sandbox-demo
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: sandbox-hostpid-demo
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: true
allowHostPorts: false
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowedCapabilities:
  - '*'
defaultAddCapabilities: []
requiredDropCapabilities: []
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:llm-sandbox-demo:hostpid-demo-sa
