apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-backend
  namespace: {{ .Values.backend.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: {{ .Values.backend.namespace }}
rules:
  - apiGroups: ["agents.x-k8s.io", "extensions.agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxclaims", "sandboxwarmpools", "sandboxtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-backend-sandbox
  namespace: {{ .Values.backend.namespace }}
subjects:
  - kind: ServiceAccount
    name: agent-backend
    namespace: {{ .Values.backend.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: {{ .Values.backend.namespace }}
  labels:
    app: agent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  template:
    metadata:
      labels:
        app: agent-backend
    spec:
      serviceAccountName: agent-backend
      containers:
        - name: agent-backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 8000
          env:
            - name: LLM_API_URL
              value: {{ .Values.llm.apiUrl | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.llm.apiKey | quote }}
            - name: MODEL_NAME
              value: {{ .Values.llm.model | quote }}
            - name: MAX_TOKENS
              value: "4096"
            - name: WARMPOOL_NAME
              value: {{ .Values.backend.warmPoolName | quote }}
            {{- if .Values.vertex.enabled }}
            - name: VERTEX_PROJECT
              value: {{ .Values.vertex.project | quote }}
            - name: VERTEX_REGION
              value: {{ .Values.vertex.region | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/gcp/application_default_credentials.json"
            {{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          {{- if .Values.vertex.enabled }}
          volumeMounts:
            - name: gcp-creds
              mountPath: /etc/gcp
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
      {{- if .Values.vertex.enabled }}
      volumes:
        - name: gcp-creds
          secret:
            secretName: gcp-credentials
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: {{ .Values.backend.namespace }}
  labels:
    app: agent-backend
spec:
  selector:
    app: agent-backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
